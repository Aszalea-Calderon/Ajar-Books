<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Applied synchronously, before first paint, to avoid a flash of the wrong theme/font.
			(function () {
				try {
					var theme = localStorage.getItem('ajar-theme');
					if (theme === 'light' || theme === 'dark') {
						document.documentElement.dataset.theme = theme;
					}
					var font = localStorage.getItem('ajar-font');
					if (font === 'dyslexic') {
						document.documentElement.dataset.font = font;
					}
					var accent = localStorage.getItem('ajar-accent');
					if (accent) {
						document.documentElement.style.setProperty('--color-primary', accent);
						var n = parseInt(accent.replace('#', ''), 16);
						var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (c) {
							var s = c / 255;
							return s <= 0.03928 ? s / 12.92 : Math.pow((s + 0.055) / 1.055, 2.4);
						});
						var lum = 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
						var text = 1.05 / (lum + 0.05) >= (lum + 0.05) / 0.05 ? '#ffffff' : '#000000';
						document.documentElement.style.setProperty('--color-primary-text', text);
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
