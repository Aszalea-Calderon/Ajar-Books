services:
  ajar-books:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - ./data:/app/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env — see .env.example}
      # SvelteKit needs to know its own origin to validate same-origin form submissions.
      # Override in .env if you're serving from a different host/port or a domain/tunnel.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      SECURE_COOKIES: ${SECURE_COOKIES:-}
      # adapter-node's default (512K) is too small for a real phone photo
      # upload (Settings > Data > Profile Icon) — must stay >= the upload
      # cap in src/lib/server/avatar.ts (MAX_AVATAR_UPLOAD_BYTES).
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-8M}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only what the entrypoint needs to chown the data volume and drop
      # from root to the unprivileged `node` user before running the app.
      - CHOWN
      - SETUID
      - SETGID
